name: Keep backend awake

# Pings the deployed backend every ~12 minutes so a free-tier host (Render)
# doesn't sleep from inactivity. Set a repository variable BACKEND_URL to your
# backend's base URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://floodwatch-api.onrender.com — until then this job no-ops.

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/meta
        run: |
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL not set yet — skipping. Add it in repo Variables to enable."
            exit 0
          fi
          echo "Pinging $URL/api/meta"
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "$URL/api/meta" || echo "000")
          echo "HTTP $code"
