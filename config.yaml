region:
  name: pakistan
  lat_min: 23.5
  lat_max: 37.5
  lon_min: 60.5
  lon_max: 77.0

data:
  events_path: CLOUDPAK25_2010_2025_v3.csv
  raw_path: data/raw/cloudburst_dataset.csv
  era5_dir: data/raw/era5/
  urbanization_path: data/raw/urbanization_index.csv
  terrain_dem_path: data/raw/terrain/dem.tif
  terrain_index_path: data/raw/terrain_index.csv
  climatology_path: data/processed/district_climatology.csv
  waterways_path: data/raw/hotosm_pak_waterways_lines_geojson.geojson
  monitored_locations_path: data/processed/monitored_locations.csv
  processed_path: data/processed/cleaned.csv
  target_column: cloudburst_occurred
  precipitation_threshold_mm_per_hr: 30
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - temperature
    - humidity
    - pressure
    - pressure_drop_3h
    - wind_speed
    - dew_point
    - cloud_cover
    - temp_dewpoint_spread
    - urbanization_index
    - elevation
    - slope
    - distance_to_waterway_km
    - waterway_count_10km
    - historical_flood_freq
  categorical: []

model:
  type: xgboost
  params:
    n_estimators: 150
    max_depth: 3
    learning_rate: 0.05
    scale_pos_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2.0
  save_path: models/cloudburst_model.pkl

# Kaggle "Flood Prediction Dataset" (Playground Series S4E5) — 50k rows,
# 20 named human/environmental factors against a continuous 0-1
# FloodProbability target. Download train.csv from
# https://www.kaggle.com/competitions/playground-series-s4e5/data and
# place it at data.raw_path below. This is a *regression* target (unlike
# the binary cloudburst_occurred above), trained/analyzed separately via
# src/models/train_flood_factors.py and src/analysis/factor_impact.py
# --dataset flood_factors.
flood_factors:
  raw_path: data/raw/flood_factors.csv
  target_column: FloodProbability
  test_size: 0.2
  random_state: 42
  features:
    - MonsoonIntensity
    - TopographyDrainage
    - RiverManagement
    - Deforestation
    - Urbanization
    - ClimateChange
    - DamsQuality
    - Siltation
    - AgriculturalPractices
    - Encroachments
    - IneffectiveDisasterPreparedness
    - DrainageSystems
    - CoastalVulnerability
    - Landslides
    - Watersheds
    - DeterioratingInfrastructure
    - PopulationScore
    - WetlandLoss
    - InadequatePlanning
    - PoliticalFactors
  model:
    type: xgboost_regressor
    params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 2.0
    save_path: models/flood_factors_model.pkl
