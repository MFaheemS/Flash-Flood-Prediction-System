data:
  raw_path: data/raw/cloudburst_dataset.csv
  processed_path: data/processed/cleaned.csv
  target_column: cloudburst_occurred
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - temperature
    - humidity
    - pressure
    - wind_speed
    - rainfall
    - dew_point
    - cloud_cover
  categorical: []

model:
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
  save_path: models/cloudburst_model.pkl
