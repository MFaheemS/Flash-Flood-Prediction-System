region:
  name: pakistan
  lat_min: 23.5
  lat_max: 37.5
  lon_min: 60.5
  lon_max: 77.0

data:
  events_path: data/raw/all_flood_events.csv
  raw_path: data/raw/cloudburst_dataset.csv
  era5_dir: data/raw/era5/
  urbanization_path: data/raw/urbanization_index.csv
  terrain_dem_path: data/raw/terrain/dem.tif
  terrain_index_path: data/raw/terrain_index.csv
  climatology_path: data/processed/district_climatology.csv
  waterways_path: data/raw/hotosm_pak_waterways_lines_geojson.geojson
  monitored_locations_path: data/processed/monitored_locations.csv
  processed_path: data/processed/cleaned.csv
  target_column: cloudburst_occurred
  precipitation_threshold_mm_per_hr: 30
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - temperature
    - humidity
    - pressure
    - pressure_drop_3h
    - wind_speed
    - dew_point
    - cloud_cover
    - temp_dewpoint_spread
    - urbanization_index
    - elevation
    - slope
    - distance_to_waterway_km
    - waterway_count_10km
    - historical_flood_freq
    - soil_clay_pct
    - soil_moisture_root
    - soil_moisture_surface
  categorical: []

model:
  type: xgboost
  params:
    n_estimators: 150
    max_depth: 3
    learning_rate: 0.05
    scale_pos_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2.0
  save_path: models/cloudburst_model.pkl

# Kaggle "Flood Prediction Dataset" (Playground Series S4E5) — 50k rows,
# 20 named human/environmental factors against a continuous 0-1
# FloodProbability target. Download train.csv from
# https://www.kaggle.com/competitions/playground-series-s4e5/data and
# place it at data.raw_path below. This is a *regression* target (unlike
# the binary cloudburst_occurred above), trained/analyzed separately via
# src/models/train_flood_factors.py and src/analysis/factor_impact.py
# --dataset flood_factors.
flood_factors:
  raw_path: data/raw/flood_factors.csv
  target_column: FloodProbability
  test_size: 0.2
  random_state: 42
  features:
    - MonsoonIntensity
    - TopographyDrainage
    - RiverManagement
    - Deforestation
    - Urbanization
    - ClimateChange
    - DamsQuality
    - Siltation
    - AgriculturalPractices
    - Encroachments
    - IneffectiveDisasterPreparedness
    - DrainageSystems
    - CoastalVulnerability
    - Landslides
    - Watersheds
    - DeterioratingInfrastructure
    - PopulationScore
    - WetlandLoss
    - InadequatePlanning
    - PoliticalFactors
  model:
    type: xgboost_regressor
    params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 2.0
    save_path: models/flood_factors_model.pkl

# Global rain-driven flood events (Dartmouth Flood Observatory global
# archive, 600-event stratified sample across ~400 countries, 1985-2010)
# -- see src/data/global_events.py and src/data/build_global_dataset.py.
# Purpose: find which weather/terrain/soil factors matter for flash
# floods *in general*, independent of Pakistan-specific proxies
# (urbanization gravity model, HOTOSM waterways, historical district
# frequency aren't globally available), then compare against the
# Pakistan-specific model's findings.
global_flood:
  raw_path: data/raw/global_flood_dataset.csv
  target_column: cloudburst_occurred
  test_size: 0.2
  random_state: 42
  features:
    - temperature
    - humidity
    - pressure
    - pressure_drop_3h
    - wind_speed
    - dew_point
    - cloud_cover
    - temp_dewpoint_spread
    - elevation
    - slope
    - soil_clay_pct
    - soil_moisture_root
    - soil_moisture_surface
  model:
    params:
      n_estimators: 150
      max_depth: 3
      learning_rate: 0.05
      scale_pos_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 2.0
    save_path: models/global_flood_model.pkl

# Satellite monthly flood panel for 6 Pakistani regions (2000-2021), built
# from user-provided Google Earth Engine exports in Datasets/ -- see
# src/data/build_satellite_dataset.py. REAL flood labels (60 flood-months)
# with naturally-matched negatives (same regions, non-flood months), and two
# physical factors absent from every other model: snow cover (NDSI) and
# vegetation (NDVI). Reported with cross-validated AUC + probability
# calibration, since a plain imbalanced fit reads risk too high everywhere.
satellite_flood:
  raw_path: data/raw/satellite_flood_dataset.csv
  target_column: flood
  random_state: 42
  features:
    - precip_total
    - precip_max
    - precip_days
    - precip_prev_month
    - temp_mean
    - temp_max
    - snow_mean
    - snow_max
    - veg_mean
    - month
    - soil_moist_surface
    - soil_moist_root
    - soil_moist_prev_month
  model:
    params:
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.05
      scale_pos_weight: 8
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 2.0
    save_path: models/satellite_flood_model.pkl

# District-level satellite monthly flood panel (119 Pakistan districts,
# 2000-2021, ~31k district-months, 126 real flood-months), built from the
# GEE monthly exports in sf/ (build_district_dataset.py) with labels from
# CLOUDPAK25 + DFO event records. The district-resolution upgrade of the
# province satellite model -- more rows, more positives, finer geography.
district_flood:
  raw_path: data/raw/district_flood_dataset.csv
  target_column: flood
  random_state: 42
  features:
    - precip_total
    - precip_max
    - precip_prev_month
    - temp_mean
    - snow_mean
    - veg_mean
    - veg_trend
    - month
  model:
    params:
      n_estimators: 250
      max_depth: 3
      learning_rate: 0.05
      scale_pos_weight: 40
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 2.0
    save_path: models/district_flood_model.pkl
